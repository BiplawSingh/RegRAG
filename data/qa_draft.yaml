- id: q077
  category: amendment
  answerable: true
  question: "What is the established rule for AIFIs for conflict of interest? "
  answer: |
    No loan or advance to any of its own directors, to any firm where a director is a partner, manager, employee or guarantor, or to companies connected to its directors (with carve-outs for subsidiaries, Section 8 companies and government companies).
  notes: ""
  gold_chunk_ids: [6890]
  gold_docs: ["RBI/2025-26/180"]
  source_text: |
    17B. In order to obviate the possibility of conflict of interest in the lending operations of the AIFIs, an AIFI shall not:
    (1) enter into any commitment for granting any loan or advance to or on behalf of:
    any of its directors, or
    any firm in which any of its directors is interested as Partner, Manager, Employee or Guarantor, or
    any company (not being a subsidiary of the AIFI or a company registered under Section 8 of the Companies Act, 2013 or a Government Company) of which, or the subsidiary or the holding company of which, any of the Directors of the AIFI is a director, managing agent, manager, employee or guarantor or in which he holds substantial interest, or
    any individual in respect of whom any of its directors is a partner or a guarantor.
    17C. Provisions of paragraph 17B above would not apply in the following cases:
    (1) Credit facilities granted or commitment made by an AIFI to a company where a director of the AIFI has substantial interest, if the advance was granted, or commitment was made, prior to the appointment of the said director on the Board of the AIFI.

