  question: "Who can be an Internal Ombudsman?"
  answer: |
     Serving or retired officer at General Manager rank or equivalent, with at least seven years in banking, NBFC, regulation, supervision, payments, credit information or consumer protection. A serving officer must resign that post first. They must never have worked for the bank or its group, must be under 70 at the end of tenure, and may serve several entities at once if those entities agree.
