  question: "For a Commercial Bank, on what basis is the Internal Ombudsman appointed, and what happens if the post falls vacant?"
  answer: |
    Internal Ombudsman appointments are contractual, and the post must never sit vacant — the Deputy IO covers temporary absence. If both are away, the bank may designate a serving General-Manager-equivalent as IO for up to one month with Customer Service Committee approval, and that person must have no reporting relationship with business verticals during the period.
  notes: ""
  gold_chunk_ids: [6795]
  gold_docs: ["RBI/CEPD/2025-26/381"]
  source_text: |
    (1) The appointment of the IO / Dy. IO in the bank shall be contractual.
    (2) The bank shall ensure that the post of the IO does not remain vacant at any point of time. During the temporary absence of the IO, the Dy. IO may function as the IO.
    (3) In a rare case where both IO/s and Dy IO/s are on leave / absent, the bank may designate its serving official equivalent to the General Manager rank as the IO for a period not exceeding one month, with the approval of the Customer Service Committee of the Board. Such official shall not have any reporting relationship with the business verticals of the bank during the period in which he/she is designated as the IO.
    (4) The tenure of the IO / Dy. IO in the bank shall be a fixed term of not less than three years. However, the total tenure (including extension/reappointment, if any) of the IO / Dy. IO in the bank shall not exceed five years.

