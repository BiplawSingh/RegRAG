    (1) ‘Adjusted Profit After Tax (PAT)’ means PAT of the financial year for which the dividend is proposed to be paid minus 50 per cent of Net NPA as on March 31 of the financial year for which the dividend is to be paid;
    (2) ‘Dividend’ means dividend payable on equity shares and includes interim dividend but excludes dividend on Perpetual Non-Cumulative Preference Shares (PNCPS); and
