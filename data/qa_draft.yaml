  gold_docs: ["RBI/CEPD/2025-26/381"]
  source_text: |
    (1) The IO shall either be a retired or serving officer, in the rank equivalent to a General Manager in the RE of the Reserve Bank under the purview of the Internal Ombudsman framework or a Financial Sector Regulatory Body, having necessary skills and experience of minimum seven years of working in areas such as banking, non-banking finance, regulation, supervision, payment and settlement systems, credit information or consumer protection.
    Provided that, if the person is a serving officer, he / she is required to relinquish the same before assuming charge as IO.
    (2) The IO shall previously not have been employed, nor presently be employed, by the bank or a holding, associate or subsidiary company of the bank.
    (3) The IO shall not be over 70 years of age before the completion of the tenure.
    (4) A person may work as the IO in more than one RE simultaneously at the discretion of the REs concerned, subject to the approval of the Board or Customer Service Committee / Consumer Protection Committee of the Board of the appointing RE.

