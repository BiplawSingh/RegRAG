    For jewellery exporters, tenor follows the Foreign Trade Policy. For all other GMLs, the bank sets tenor per its own policy aligned to the jeweller's working-capital cycle, capped at 270 days. Repayment of principal and interest is in rupees, computed on the prevailing gold value.
