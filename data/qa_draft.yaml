  answerable: true
  question: "What do banks do to spot fake currency? Give me details."
  answer: |
    Every bank branch must have UV lamps and note-checking machines to spot fake currency. Banks must keep a daily record of notes machine-processed and how many fakes were found, and must provide note-counting machines with a customer-facing display at the counter.
  notes: ""
  gold_chunk_ids: [5942]
  gold_docs: ["RBI/DCM/2026-27/394"]
  source_text: |
    8.1 With a view to facilitate the detection of Counterfeit Notes, all bank branches/ identified back offices shall be equipped with ultra-violet lamps/ Note Sorting/ Authentication Machines. In addition, all CC branches shall be equipped with verification, processing and sorting machines and shall be used to their optimum capacity. Such machines shall conform to 'Note Authentication and Fitness Sorting Parameters' prescribed in terms of circular DCM(NPD)No.S488/18.00.14/2022-23 dated July 1, 2022 , as also, the Indian Standards duly certified by Bureau of Indian Standards (BIS) as required in terms of circular DCM(NPD)No.S2193/09.45.000/2024-25 dated October 30, 2024
    8.2 The banks shall maintain a daily record of the notes processed through the Note Sorting Machines, including the number of counterfeits detected.
    8.3 The banks shall also provide note counting machines (with dual display facility) for public use at the counters.

